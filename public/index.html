<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-session-recap 会话浏览器</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>agent-session-recap <span class="sub">只读会话浏览器</span></h1>
  <div class="src" id="sessionsDir"></div>
  <span class="spacer"></span>
  <button id="openProviders">AI 供应商</button>
</header>

<!-- 筛选条件构建器 -->
<section class="fb">
  <div class="fb-head">
    <span class="fb-title">设置筛选条件</span>
    <label class="fb-logic">条件关系
      <select id="logic">
        <option value="and">满足全部（且）</option>
        <option value="or">满足任一（或）</option>
      </select>
    </label>
  </div>
  <div id="conditions" class="conditions"></div>
  <div class="fb-foot">
    <button id="addCond">＋ 添加条件</button>
    <button id="clearCond">清空条件</button>
    <span class="spacer"></span>
    <button id="apply" class="primary">应用筛选</button>
  </div>
</section>

<!-- 快捷导出 -->
<section class="quick">
  <span class="quick-label">快捷导出：</span>
  <label class="quick-field">时间依据
    <select id="quickField">
      <option value="lastActivity">最后活动时间</option>
      <option value="lastMessage">最后一条消息时间</option>
      <option value="created">创建时间</option>
      <option value="mtime">文件更新时间</option>
    </select>
  </label>
  <button data-quick="yesterday">导出昨天</button>
  <button data-quick="today">导出今天</button>
  <button data-quick="thisWeek">导出这周</button>
  <button data-quick="lastWeek">导出上周</button>
  <button data-quick="thisMonth">导出这个月</button>
  <button data-quick="lastMonth">导出上个月</button>
</section>

<!-- AI 工具条 -->
<section class="ai-bar">
  <span class="ai-bar-label">AI：</span>
  <button id="aiSummarizeSelected">总结所选会话</button>
  <button id="aiBatch">摘要总结筛选结果</button>
  <button id="aiAsk">对筛选结果提问</button>
  <span class="spacer"></span>
  <span id="aiCurrent" class="muted"></span>
</section>

<section class="bar">
  <div id="stats" class="stats">—</div>
  <div class="bar-right">
    <button id="selectAll">全选</button>
    <button id="selectNone">全不选</button>
  </div>
</section>

<section class="table-wrap">
  <table id="table">
    <colgroup id="cols"></colgroup>
    <thead>
      <tr>
        <th class="pick"><input type="checkbox" id="headPick"></th>
        <th data-key="cwd">工作目录</th>
        <th data-key="displayName">会话名称</th>
        <th data-key="id">会话 ID</th>
        <th data-key="created">创建时间</th>
        <th data-key="lastMessage">最后消息</th>
        <th data-key="lastActivity">最后活动</th>
        <th data-key="mtime">文件更新时间</th>
        <th data-key="size" class="num">大小</th>
        <th data-key="archived">归档</th>
        <th class="ai-col">AI</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</section>

<section class="export">
  <label>导出格式
    <select id="format">
      <option value="jsonl">JSONL（原样复制）</option>
      <option value="md">Markdown</option>
      <option value="html">HTML</option>
    </select>
  </label>
  <label class="grow">导出到
    <input type="text" id="outDir">
  </label>
  <button id="pickDir">选择目录…</button>
  <button id="export" class="primary">导出所选</button>
</section>

<div id="status" class="status"></div>

<!-- 确认导出弹框 -->
<div id="modal" class="modal-backdrop hidden">
  <div class="modal">
    <h2 id="modalTitle">确认导出</h2>
    <div class="modal-body">
      <p id="modalSummary"></p>
      <label class="modal-dir">导出目录
        <span class="dir-row">
          <input type="text" id="modalOutDir">
          <button id="modalPickDir">选择…</button>
        </span>
      </label>
    </div>
    <div class="modal-foot">
      <button id="modalCancel">取消</button>
      <button id="modalConfirm" class="primary">确认导出</button>
    </div>
  </div>
</div>

<!-- AI 面板 -->
<div id="aiModal" class="modal-backdrop hidden">
  <div class="modal ai-modal">
    <div class="panel-head">
      <h2 id="aiTitle">AI</h2>
      <span id="aiMeta" class="muted"></span>
      <span class="spacer"></span>
      <label class="ai-pick">供应商
        <select id="aiProvider"></select>
      </label>
      <label class="ai-pick">模型
        <select id="aiModel"></select>
      </label>
      <button id="aiClose" class="icon-btn" title="关闭">✕</button>
    </div>
    <div id="aiProgress" class="ai-progress"></div>
    <div id="aiOutput" class="ai-output"></div>
    <div id="aiAskRow" class="ai-ask hidden">
      <textarea id="aiQuestion" rows="2" placeholder="就筛选出的会话提问，例如：这些会话里都改动了哪些文件？"></textarea>
      <button id="aiSend" class="primary">发送</button>
    </div>
    <div class="modal-foot">
      <span id="aiStatus" class="muted"></span>
      <span class="spacer"></span>
      <button id="aiStop" class="hidden">停止</button>
      <button id="aiCloseBtn">关闭</button>
    </div>
  </div>
</div>

<!-- 供应商管理 -->
<div id="provModal" class="modal-backdrop hidden">
  <div class="modal prov-modal">
    <div class="panel-head">
      <h2>AI 供应商</h2>
      <input id="provSearch" class="search" placeholder="查找供应商">
      <span class="spacer"></span>
      <button id="provAdd" class="primary">＋ 添加供应商</button>
      <button id="provClose" class="icon-btn">✕</button>
    </div>
    <div id="provList" class="prov-list"></div>
    <div class="modal-foot">
      <span id="provStatus" class="muted"></span>
      <span class="spacer"></span>
      <button id="provCloseBtn">关闭</button>
    </div>
  </div>
</div>

<!-- 添加供应商 -->
<div id="addProvModal" class="modal-backdrop hidden">
  <div class="modal add-prov">
    <div class="panel-head">
      <h2 id="addProvTitle">添加供应商</h2>
      <span class="spacer"></span>
      <button id="addProvClose" class="icon-btn">✕</button>
    </div>
    <div id="addProvPicker" class="add-picker">
      <input id="presetSearch" class="search" placeholder="查找供应商… 或点选一个卡片">
      <div id="presetGroups" class="preset-groups"></div>
    </div>
    <div id="addProvForm" class="add-form hidden"></div>
    <div class="modal-foot">
      <span id="addProvStatus" class="muted"></span>
      <span class="spacer"></span>
      <button id="addProvBack" class="hidden">← 返回</button>
      <button id="addProvCancel">取消</button>
      <button id="addProvSave" class="primary">添加</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script src="/ai.js"></script>
</body>
</html>
